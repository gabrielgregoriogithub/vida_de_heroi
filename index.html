<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vida de Heroi</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#080d19; color:#d7e1ec; font-family:system-ui,sans-serif; }
    main { width:min(1152px,100vw); padding:14px; }
    h1 { margin:0 0 8px; color:#f4d37d; font-size:clamp(20px,3vw,30px); }
    .wrap { position:relative; width:100%; aspect-ratio:16/9; border:2px solid #384763; box-shadow:0 0 40px #050912; background:#10182c; }
    canvas { display:block; width:100%; height:100%; image-rendering:auto; }
    .help { margin-top:8px; color:#9aaac2; font-size:13px; text-align:center; }
    .touch { display:flex; justify-content:space-between; gap:8px; margin-top:10px; user-select:none; touch-action:none; }
    .touch .group { display:flex; gap:8px; }
    .touch button { min-width:52px; min-height:42px; border:1px solid #53627d; border-radius:8px; background:#182238; color:#fff; font-weight:700; touch-action:none; }
    .touch button:active { background:#35628b; transform:translateY(1px); }
    @media (min-width:800px) { .touch { display:none; } }
    kbd { padding:2px 6px; border:1px solid #53627d; border-radius:4px; background:#182238; color:#fff; }
  </style>
</head>
<body>
<main>
  <h1>Vida de Heroi</h1>
  <div class="wrap"><canvas id="game" width="1152" height="648"></canvas></div>
  <div class="touch"><div class="group"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div class="group"><button data-key="KeyQ">Q</button><button data-key="KeyJ">ATK</button><button data-key="KeyK">ARCO</button><button data-key="KeyL">ESCUDO</button><button data-key="Space">PULO</button></div></div>
  <div class="help"><kbd>A</kbd><kbd>D</kbd> mover &nbsp; <kbd>Espaco</kbd> pular &nbsp; <kbd>J</kbd> atacar &nbsp; <kbd>K</kbd> disparar &nbsp; <kbd>L</kbd> escudo &nbsp; <kbd>Q</kbd> trocar arma</div>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=1152,H=648,FLOOR=540;
const keys=new Set(); let pressed=new Set();
addEventListener('keydown',e=>{ if(!keys.has(e.code)) pressed.add(e.code); keys.add(e.code); if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault(); });
addEventListener('keyup',e=>keys.delete(e.code));
document.querySelectorAll('[data-key]').forEach(button=>{const code=button.dataset.key;button.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(code);pressed.add(code);});['pointerup','pointercancel','pointerleave'].forEach(type=>button.addEventListener(type,e=>{e.preventDefault();keys.delete(code);}));});
const down=(...codes)=>codes.some(c=>keys.has(c)), hit=(...codes)=>codes.some(c=>pressed.has(c));
let level=1, victory=false, started=false, paused=false, time=0, weapon=0, msg='Recupere as runas e atravesse o portao.',msgTime=4, totalRunes=0;
const hero={x:145,y:470,vx:0,vy:0,face:1,armor:0,hp:3,inv:0,attack:0,attackCd:0,bowCd:0,jumps:0,jumpFx:0};
let platforms=[],enemies=[],runes=[],arrows=[];
function loadLevel(n){ level=n; victory=false; time=0; arrows=[]; hero.x=n===2?55:145;hero.y=470;hero.vx=hero.vy=0;hero.inv=1;
  hero.jumps=0;hero.jumpFx=0;
  if(n===1){platforms=[[0,FLOOR,W,108],[100,430,235,24],[420,365,225,24],[745,455,245,24],[885,290,195,24]]; enemies=[[580,320,-1,38,1,2],[875,410,1,45,1,2],[970,245,-1,32,1,2]];runes=[[535,325],[930,250]];}
  else {platforms=[[0,FLOOR,W,108],[80,440,180,24],[320,350,180,24],[560,430,190,24],[800,320,180,24],[1010,235,120,24]];enemies=[[215,400,1,55,1,2],[405,315,-1,45,1,2],[665,395,1,60,1,2],[880,285,-1,48,1,2],[1060,200,-1,28,1,8]];runes=[[410,310],[860,280]];}
  msg=`Fase ${n}: ${n===1?'As Ruinas do Crepusculo':'O Santuario do Rei Caido'}.`;msgTime=3;
}
loadLevel(1);
function floor(){return platforms.some(p=>hero.x>p[0]-18&&hero.x<p[0]+p[2]+18&&Math.abs(hero.y+35-p[1])<5)}
function damage(){if(hero.inv>0)return; hero.inv=1.15;if(hero.armor>0){hero.armor--;msg='A armadura foi quebrada!';}else{hero.hp--;msg='Voce foi atingido!';}msgTime=1.2;if(hero.hp<=0){hero.hp=3;hero.armor=0;hero.x=level===2?55:145;hero.y=470;msg='A jornada recomeca...';}}
function update(dt){time+=dt;if(hit('Escape'))paused=!paused;if(victory){if(hit('Space')){hero.hp=3;hero.armor=0;totalRunes=0;loadLevel(1);}return;}if(paused)return;
  if(!started){if(hit('Space','Enter')){started=true;msg='A aventura comeca!';msgTime=2;}return;}
  const axis=(down('ArrowRight','KeyD')?1:0)-(down('ArrowLeft','KeyA')?1:0),blocking=down('KeyL')&&weapon===2;
  if(axis){hero.face=axis;hero.vx+=(axis*285-hero.vx)*Math.min(1,16*dt);}else hero.vx*=Math.max(0,1-12*dt);
  if(hit('KeyQ')){weapon=(weapon+1)%3;msg='Equipado: '+['ESPADA','ARCO','ESCUDO'][weapon];msgTime=1.5;}
  if(hit('Space','ArrowUp')){if(floor()){hero.vy=-585;hero.jumps=1;}else if(hero.jumps<2){hero.vy=-535;hero.jumps=2;hero.jumpFx=.28;msg='Pulo duplo!';msgTime=.7;}}
  if(!blocking)hero.vy+=1450*dt;else hero.vx*=.35;
  hero.attackCd=Math.max(0,hero.attackCd-dt);hero.bowCd=Math.max(0,hero.bowCd-dt);hero.attack=Math.max(0,hero.attack-dt);
  if(hit('KeyJ')&&hero.attackCd<=0){if(weapon===0){hero.attack=.18;hero.attackCd=.34;const hx=hero.x+hero.face*28;enemies.forEach(e=>{if(e[4]&&Math.abs(e[0]-hx)<58&&Math.abs(e[1]-hero.y)<62){e[5]--;if(e[5]<=0){e[4]=0;msg='Inimigo derrotado!';}else{msg='Acerto! O inimigo ainda resiste.';}msgTime=.7;}});}else if(weapon===1&&hero.bowCd<=0){arrows.push({x:hero.x+hero.face*28,y:hero.y-24,vx:hero.face*650,vy:-20,life:2});hero.bowCd=.42;}}
  hero.vy=Math.min(hero.vy,900);hero.x+=hero.vx*dt;hero.y+=hero.vy*dt;
  if(hero.y+35>=FLOOR){hero.y=FLOOR-35;hero.vy=0;hero.jumps=0;} platforms.forEach(p=>{if(hero.x>p[0]-18&&hero.x<p[0]+p[2]+18&&hero.vy>=0&&hero.y+35>=p[1]&&hero.y+35<=p[1]+20){hero.y=p[1]-35;hero.vy=0;hero.jumps=0;}});hero.x=Math.max(24,Math.min(W-24,hero.x));hero.jumpFx=Math.max(0,hero.jumpFx-dt);
  arrows.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=180*dt;a.life-=dt;enemies.forEach(e=>{if(e[4]&&Math.hypot(a.x-e[0],a.y-e[1])<34){e[5]--;if(e[5]<=0)e[4]=0;a.life=0;}})});arrows=arrows.filter(a=>a.life>0&&a.x>-20&&a.x<W+20&&a.y<H);
  enemies.forEach(e=>{if(!e[4])return;e[0]+=e[2]*e[3]*dt;if(e[0]<20||e[0]>W-20)e[2]*=-1;if(Math.hypot(hero.x-e[0],hero.y-e[1])<38){if(blocking){e[2]*=-1;msg='Bloqueio perfeito!';msgTime=.7;}else damage();}});
  for(let i=runes.length-1;i>=0;i--)if(Math.hypot(hero.x-runes[i][0],hero.y-runes[i][1])<40){runes.splice(i,1);totalRunes++;hero.armor=Math.min(2,hero.armor+1);msg=`Armadura recuperada: estagio ${hero.armor+1}/3`;msgTime=2.5;}
  if(!runes.length&&hero.x>W-75){if(level===1)loadLevel(2);else if(enemies.every(e=>!e[4])){victory=true;msg='A lenda foi concluida!';}else{msg='O Guardiao ainda protege o portao.';msgTime=1.2;}}
  hero.inv=Math.max(0,hero.inv-dt);msgTime=Math.max(0,msgTime-dt);
}
function text(s,x,y,size,color='#fff',align='left'){ctx.fillStyle=color;ctx.font=`${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function draw(){const sky=level===1?'#10182c':'#21152d';ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f5d58a';ctx.beginPath();ctx.arc(935,100,62,0,7);ctx.fill();
  for(let i=0;i<8;i++){const x=i*180-40;ctx.fillStyle=level===1?'#182844':'#39203d';ctx.beginPath();ctx.moveTo(x,FLOOR);ctx.lineTo(x+90,330);ctx.lineTo(x+210,FLOOR);ctx.fill();}
  platforms.forEach(p=>{ctx.fillStyle='#513e35';ctx.fillRect(...p);ctx.fillStyle='#7eb35a';ctx.fillRect(p[0],p[1],p[2],7);});
  runes.forEach(r=>{ctx.fillStyle='rgba(125,230,255,.18)';ctx.beginPath();ctx.arc(r[0],r[1],20+Math.sin(time*4)*3,0,7);ctx.fill();ctx.fillStyle='#7de6ff';ctx.beginPath();ctx.arc(r[0],r[1],12,0,7);ctx.fill();ctx.fillStyle='#e4ffff';ctx.beginPath();ctx.arc(r[0],r[1],6,0,7);ctx.fill();});
  enemies.forEach(e=>{if(!e[4])return;const boss=e[5]>2;ctx.fillStyle=boss?'#8f4fb4':'#a83f4d';ctx.beginPath();ctx.arc(e[0],e[1]-11,boss?22:14,0,7);ctx.fill();ctx.fillStyle=boss?'#4d2867':'#6b293b';ctx.fillRect(e[0]-(boss?20:13),e[1]+2,boss?40:26,boss?38:25);ctx.fillStyle='#fff';ctx.fillRect(e[0]-8,e[1]-16,5,5);ctx.fillRect(e[0]+3,e[1]-16,5,5);if(boss){ctx.fillStyle='#31162f';ctx.fillRect(e[0]-32,e[1]-48,64,7);ctx.fillStyle='#e66c83';ctx.fillRect(e[0]-32,e[1]-48,64*(e[5]/8),7);}});
  arrows.forEach(a=>{ctx.strokeStyle='#e8c777';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x-a.vx/Math.abs(a.vx)*18,a.y);ctx.stroke();});
  if(!runes.length){ctx.fillStyle='#b67a45';ctx.fillRect(W-55,FLOOR-84,28,84);ctx.fillStyle='#7de6ff';ctx.beginPath();ctx.arc(W-41,FLOOR-52,7,0,7);ctx.fill();}
  drawHero();drawUI();if(!started){ctx.fillStyle='rgba(3,5,10,.94)';ctx.fillRect(210,155,732,285);text('VIDA DE HEROI',576,230,48,'#f4d37d','center');text('Uma jornada de espada, arco e escudo.',576,275,20,'#d7e1ec','center');text('Recupere as runas, evolua sua armadura e enfrente o Guardiao.',576,310,17,'#d7e1ec','center');text('ESPACO: comecar',576,370,23,'#7de6ff','center');}if(paused){ctx.fillStyle='rgba(3,5,10,.82)';ctx.fillRect(330,220,492,170);text('PAUSADO',576,285,42,'#f4d37d','center');text('Pressione ESC para continuar',576,330,20,'#d7e1ec','center');}if(victory){ctx.fillStyle='rgba(3,5,10,.94)';ctx.fillRect(210,175,732,245);text('A LENDA VIVE',576,250,46,'#f4d37d','center');text('Voce recuperou a armadura e venceu as ruinas.',576,300,20,'#d7e1ec','center');text('ESPACO: recomecar',576,355,21,'#7de6ff','center');}}
function drawHero(){if(hero.inv>0&&Math.floor(hero.inv*12)%2===0)return;const p=hero,colors=['#9b5b48','#d0d8df','#f0c45d'],c=colors[p.armor];if(hero.jumpFx>0){ctx.strokeStyle=`rgba(125,230,255,${hero.jumpFx*3})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y+35,26+(1-hero.jumpFx)*20,0,7);ctx.stroke();}ctx.fillStyle='#d89568';ctx.beginPath();ctx.arc(p.x,p.y-43,15,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(p.x-18,p.y-28);ctx.lineTo(p.x+18,p.y-28);ctx.lineTo(p.x+14,p.y+12);ctx.lineTo(p.x-14,p.y+12);ctx.fill();ctx.fillStyle='#343d5a';ctx.fillRect(p.x-16,p.y+10,12,25);ctx.fillRect(p.x+4,p.y+10,12,25);if(p.armor>0){ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y-43,18,Math.PI,0);ctx.stroke();}
  if(weapon===2){ctx.fillStyle='#4b8cb7';ctx.beginPath();ctx.arc(p.x+p.face*24,p.y-20,18,0,7);ctx.fill();ctx.fillStyle='#8fd2de';ctx.beginPath();ctx.arc(p.x+p.face*24,p.y-20,13,0,7);ctx.fill();}else if(weapon===1){ctx.strokeStyle='#c99a58';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x+p.face*17,p.y-26,18,-Math.PI/2,Math.PI/2);ctx.stroke();}else{ctx.strokeStyle='#e9edf5';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x+p.face*12,p.y-20);ctx.lineTo(p.x+p.face*(p.attack>0?52:36),p.y-32);ctx.stroke();}}
function drawUI(){ctx.fillStyle='rgba(3,5,10,.9)';ctx.fillRect(20,18,1112,76);text('VIDA DE HEROI',38,46,24,'#f4d37d');text(`F${level}  ${level===1?'As Ruinas do Crepusculo':'O Santuario do Rei Caido'}`,270,43,16);text(`HP ${hero.hp}   ARMADURA ${hero.armor+1}/3   |   ${['ESPADA','ARCO','ESCUDO'][weapon]}`,38,74,17,'#ff8b82');text('A/D mover  ESPACO pulo duplo  J atacar  K disparar  L escudo  Q trocar',650,74,13);if(msgTime&&!victory)text(msg,576,615,19,'#fff','center');const objective=runes.length?`RUNAS: ${runes.length} RESTANTES`:level===2&&enemies.some(e=>e[4])?'DERROTE O GUARDIAO':'PORTAO ABERTO - SIGA EM FRENTE';text(objective,576,120,18,runes.length||level===2&&enemies.some(e=>e[4])?'#7de6ff':'#9eea86','center');}
let last=0;function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();pressed.clear();requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
</body>
</html>
