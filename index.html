<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vida de Heroi</title>
  <link rel="icon" type="image/png" href="assets/vida-de-heroi-icon.png">
  <link rel="apple-touch-icon" href="assets/vida-de-heroi-icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#080d19; color:#d7e1ec; font-family:system-ui,sans-serif; }
    main { width:min(1152px,100vw); padding:14px; }
    h1 { margin:0 0 8px; color:#f4d37d; font-size:clamp(20px,3vw,30px); }
    .wrap { position:relative; width:100%; aspect-ratio:16/9; border:2px solid #384763; box-shadow:0 0 40px #050912; background:#10182c; }
    canvas { display:block; width:100%; height:100%; image-rendering:auto; }
    .help { margin-top:8px; color:#9aaac2; font-size:13px; text-align:center; }
    .touch { display:flex; justify-content:space-between; gap:8px; margin-top:10px; user-select:none; touch-action:none; }
    .touch .group { display:flex; gap:8px; }
    .touch button { min-width:52px; min-height:42px; border:1px solid #53627d; border-radius:8px; background:#182238; color:#fff; font-weight:700; touch-action:none; }
    .touch button:active { background:#35628b; transform:translateY(1px); }
    @media (min-width:800px) { .touch { display:none; } }
    kbd { padding:2px 6px; border:1px solid #53627d; border-radius:4px; background:#182238; color:#fff; }
  </style>
</head>
<body>
<main>
  <h1>Vida de Heroi</h1>
  <div class="wrap"><canvas id="game" width="1152" height="648"></canvas></div>
  <div class="touch"><div class="group"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div class="group"><button data-key="ShiftLeft">DASH</button><button data-key="KeyJ">ATK</button><button data-key="KeyL">BLOQ.</button><button data-key="Space">PULO</button></div></div>
  <div class="help"><kbd>A</kbd><kbd>D</kbd> mover &nbsp; <kbd>W</kbd> ou <kbd>Espaco</kbd> pular &nbsp; <kbd>J</kbd> atacar &nbsp; <kbd>L</kbd> bloquear projeteis</div>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=1152,H=648,FLOOR=540;
const heroSprite=new Image(),goblinSprite=new Image(),bossSprite=new Image();
heroSprite.src='assets/hero-pixel.png';goblinSprite.src='assets/goblin-pixel.png';bossSprite.src='assets/eclipse-king-pixel.png';
const keys=new Set(); let pressed=new Set();
addEventListener('keydown',e=>{ if(!keys.has(e.code)) pressed.add(e.code); keys.add(e.code); if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault(); });
addEventListener('keyup',e=>keys.delete(e.code));
document.querySelectorAll('[data-key]').forEach(button=>{const code=button.dataset.key;button.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(code);pressed.add(code);});['pointerup','pointercancel','pointerleave'].forEach(type=>button.addEventListener(type,e=>{e.preventDefault();keys.delete(code);}));});
const down=(...codes)=>codes.some(c=>keys.has(c)), hit=(...codes)=>codes.some(c=>pressed.has(c));
let level=1, victory=false, started=false, paused=false, time=0, weapon=0, shieldLevel=0, shieldHits=0, msg='Recupere as runas e atravesse o portao.',msgTime=4, totalRunes=0, checkpoint=false, checkpointX=145, checkpointY=470;
const hero={x:145,y:470,vx:0,vy:0,face:1,armor:0,hp:3,inv:0,attack:0,attackCd:0,bowCd:0,charge:0,specialFx:0,dashCd:0,dashFx:0,jumps:0,jumpFx:0};
let platforms=[],enemies=[],runes=[],arrows=[],enemyShots=[],weapons=[],shieldPickups=[];
function loadLevel(n){ level=n; victory=false; time=0; arrows=[]; enemyShots=[]; checkpoint=false; checkpointX=n===2?55:145; checkpointY=470; hero.x=checkpointX;hero.y=checkpointY;hero.vx=hero.vy=0;hero.inv=1;
  hero.jumps=0;hero.jumpFx=0;hero.charge=0;hero.specialFx=0;hero.dashCd=0;hero.dashFx=0;
  if(n===1){platforms=[[0,FLOOR,W,108],[100,430,235,24],[420,365,225,24],[745,455,245,24],[885,290,195,24]]; enemies=[[580,320,-1,38,1,2,0],[875,410,1,45,1,2,1],[970,245,-1,32,1,2,0]];runes=[[535,325],[930,250]];weapons=[[335,395,1,1]];shieldPickups=[[210,395,1,1]];}
  else if(n===2){platforms=[[0,FLOOR,W,108],[80,440,180,24],[320,350,180,24],[560,430,190,24],[800,320,180,24],[1010,235,120,24]];enemies=[[215,400,1,55,1,2,1],[405,315,-1,45,1,2,0],[665,395,1,60,1,2,1],[880,285,-1,48,1,2,2],[1060,200,-1,28,1,8,3]];runes=[[410,310],[860,280]];weapons=[];shieldPickups=[[750,395,2,1]];}
  else {platforms=[[0,FLOOR,W,108],[90,420,190,24],[350,330,190,24],[600,445,180,24],[830,350,200,24],[1020,245,112,24]];enemies=[[235,380,1,50,1,3,2],[430,295,-1,60,1,3,1],[690,410,1,55,1,3,0],[915,315,-1,52,1,3,2],[1060,210,-1,24,1,12,3]];runes=[[430,290],[910,310]];weapons=[[780,410,2,1]];shieldPickups=[];}
  msg=`Fase ${n}: ${n===1?'As Ruinas do Crepusculo':n===2?'O Santuario do Rei Caido':'A Cidadela do Eclipse'}.`;msgTime=3;
}
loadLevel(1);
function floor(){return platforms.some(p=>hero.x>p[0]-18&&hero.x<p[0]+p[2]+18&&Math.abs(hero.y+35-p[1])<5)}
function damage(){if(hero.inv>0)return; hero.inv=1.15;if(hero.armor>0){hero.armor--;msg='A armadura foi quebrada!';}else{hero.hp--;msg='Voce foi atingido!';}msgTime=1.2;if(hero.hp<=0){hero.hp=3;hero.armor=0;hero.x=checkpointX;hero.y=checkpointY;msg=checkpoint?'Voce voltou ao checkpoint.':'A jornada recomeca...';}}
function fireWeapon(vy,power,type=weapon){const stats=[{speed:760,gravity:18,life:1.6},{speed:560,gravity:260,life:2.2},{speed:470,gravity:55,life:2.4}][type];arrows.push({x:hero.x+hero.face*28,y:hero.y-24,vx:hero.face*stats.speed,vy:vy,gravity:stats.gravity,life:stats.life,power:power,kind:type,pierce:type===2,hitIds:[]});}
function normalAttack(){if(hero.attackCd>0)return;const power=1+hero.armor;const cadence=[.55,.32,.9][weapon];hero.attackCd=cadence;hero.attack=.22;if(weapon===0)fireWeapon(-8,power);else if(weapon===1)fireWeapon(-115,power);else fireWeapon(-20,power);}
function specialAttack(){if(hero.attackCd>0)return;hero.specialFx=.55;if(weapon===0){hero.attackCd=.9;hero.attack=.45;fireWeapon(-105,3);fireWeapon(0,3);fireWeapon(105,3);msg='Especial: Espadas da Tempestade!';}else if(weapon===1){hero.attackCd=.78;hero.attack=.35;[-190,-95,0,95,190].forEach(v=>fireWeapon(v,3));msg='Especial: Chuva de Flechas!';}else{hero.attackCd=1.15;hero.attack=.55;fireWeapon(-25,6);msg='Especial: Lanca do Eclipse!';}msgTime=1.5;}
function update(dt){time+=dt;if(hit('Escape'))paused=!paused;if(victory){if(hit('Space')){hero.hp=3;hero.armor=0;weapon=0;shieldLevel=0;shieldHits=0;totalRunes=0;loadLevel(1);}return;}if(paused)return;
  if(!started){if(hit('Space','Enter')){started=true;msg='A aventura comeca!';msgTime=2;}return;}
  const axis=(down('ArrowRight','KeyD')?1:0)-(down('ArrowLeft','KeyA')?1:0),blocking=down('KeyL')&&shieldLevel>0;
  if(axis){hero.face=axis;hero.vx+=(axis*285-hero.vx)*Math.min(1,16*dt);}else hero.vx*=Math.max(0,1-12*dt);
  hero.dashCd=Math.max(0,hero.dashCd-dt);hero.dashFx=Math.max(0,hero.dashFx-dt);
  if(hit('ShiftLeft','ShiftRight')&&hero.dashCd<=0){hero.vx=hero.face*720;hero.inv=Math.max(hero.inv,.32);hero.dashCd=.95;hero.dashFx=.24;msg='Investida!';msgTime=.55;}
  if(hit('Space','ArrowUp','KeyW')){if(floor()){hero.vy=-585;hero.jumps=1;}else if(hero.jumps<2){hero.vy=-535;hero.jumps=2;hero.jumpFx=.28;msg='Pulo duplo!';msgTime=.7;}}
  if(!blocking)hero.vy+=1450*dt;else hero.vx*=.35;
  hero.attackCd=Math.max(0,hero.attackCd-dt);hero.bowCd=Math.max(0,hero.bowCd-dt);hero.attack=Math.max(0,hero.attack-dt);
  if(hero.armor===2&&down('KeyJ'))hero.charge=Math.min(1.2,hero.charge+dt);else if(hero.armor===2&&hero.charge>0){if(hero.charge>=.38)specialAttack();else normalAttack();hero.charge=0;}else if(hero.armor<2&&hit('KeyJ'))normalAttack();
  hero.vy=Math.min(hero.vy,900);hero.x+=hero.vx*dt;hero.y+=hero.vy*dt;
  if(hero.y+35>=FLOOR){hero.y=FLOOR-35;hero.vy=0;hero.jumps=0;} platforms.forEach(p=>{if(hero.x>p[0]-18&&hero.x<p[0]+p[2]+18&&hero.vy>=0&&hero.y+35>=p[1]&&hero.y+35<=p[1]+20){hero.y=p[1]-35;hero.vy=0;hero.jumps=0;}});hero.x=Math.max(24,Math.min(W-24,hero.x));hero.jumpFx=Math.max(0,hero.jumpFx-dt);
  arrows.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=(a.gravity||0)*dt;a.life-=dt;enemies.forEach(e=>{if(e[4]&&!a.hitIds.includes(e)&&Math.hypot(a.x-e[0],a.y-e[1])<34){a.hitIds.push(e);e[5]-=a.power||1;if(e[5]<=0)e[4]=0;if(!a.pierce)a.life=0;}})});arrows=arrows.filter(a=>a.life>0&&a.x>-20&&a.x<W+20&&a.y<H);
  enemies.forEach(e=>{if(!e[4])return;e[0]+=e[2]*e[3]*dt;if(e[0]<20||e[0]>W-20)e[2]*=-1;if(Math.hypot(hero.x-e[0],hero.y-e[1])<38)damage();});
  for(let i=runes.length-1;i>=0;i--)if(Math.hypot(hero.x-runes[i][0],hero.y-runes[i][1])<40){runes.splice(i,1);totalRunes++;hero.armor=Math.min(2,hero.armor+1);if(!checkpoint){checkpoint=true;checkpointX=hero.x;checkpointY=hero.y;msg='Checkpoint ativado!';}else msg=`Armadura recuperada: estagio ${hero.armor+1}/3`;msgTime=2.5;}
  weapons.forEach(item=>{if(!item[3]||Math.hypot(hero.x-item[0],hero.y-item[1])>48)return;weapon=item[2];item[3]=0;msg='Arma principal trocada: '+['ESPADA','ARCO','LANCA'][weapon];msgTime=2;});
  shieldPickups.forEach(item=>{if(!item[3]||Math.hypot(hero.x-item[0],hero.y-item[1])>48)return;shieldLevel=Math.max(shieldLevel,item[2]);shieldHits=shieldLevel===1?3:6;item[3]=0;msg=`Escudo nivel ${shieldLevel} equipado: ${shieldHits} bloqueios.`;msgTime=2.5;});
  if(level>=2){const boss=enemies.find(e=>e[4]&&e[6]===3);if(boss&&Math.random()<dt/(boss[5]<=6?1.35:2.4)){const dir=hero.x<boss[0]?-1:1;if(boss[5]<=6){[-28,0,28].forEach(offset=>enemyShots.push({x:boss[0],y:boss[1]-22+offset,vx:dir*300,life:4}));msg='O Rei do Eclipse entrou em furia!';msgTime=.8;}else enemyShots.push({x:boss[0],y:boss[1]-22,vx:dir*300,life:4});}}
  enemyShots.forEach(s=>{s.x+=s.vx*dt;s.y+=(s.vy||0)*dt;s.life-=dt;const shieldX=hero.x+hero.face*25,shieldY=hero.y-20;if(blocking&&Math.hypot(s.x-shieldX,s.y-shieldY)<22){s.life=0;shieldHits--;msg='Projetil bloqueado!';msgTime=.7;if(shieldHits<=0){shieldLevel=0;shieldHits=0;msg='O escudo quebrou!';msgTime=1.4;}}else if(Math.hypot(s.x-hero.x,s.y-(hero.y-18))<25){s.life=0;damage();}});enemyShots=enemyShots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);
  if(!runes.length&&hero.x>W-75){if(level===1||(level>1&&enemies.every(e=>!e[4]))){if(level<3)loadLevel(level+1);else{victory=true;msg='A lenda foi concluida!';}}else{msg=level===3?'O Rei do Eclipse ainda protege a cidadela.':'O Guardiao ainda protege o portao.';msgTime=1.2;}}
  hero.inv=Math.max(0,hero.inv-dt);hero.specialFx=Math.max(0,hero.specialFx-dt);msgTime=Math.max(0,msgTime-dt);
}
function text(s,x,y,size,color='#fff',align='left'){ctx.fillStyle=color;ctx.font=`${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function draw(){const sky=level===1?'#10182c':'#21152d';const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,level===1?'#0b1328':'#1a1028');grad.addColorStop(.62,sky);grad.addColorStop(1,'#080b16');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(245,213,138,.10)';ctx.beginPath();ctx.arc(935,100,110,0,7);ctx.fill();ctx.fillStyle='#f5d58a';ctx.beginPath();ctx.arc(935,100,62,0,7);ctx.fill();
  for(let i=0;i<8;i++){const x=i*180-40;ctx.fillStyle=level===1?'#182844':'#39203d';ctx.beginPath();ctx.moveTo(x,FLOOR);ctx.lineTo(x+90,330);ctx.lineTo(x+210,FLOOR);ctx.fill();}
  drawRuinsAndSky();
  platforms.forEach(p=>{const stone=ctx.createLinearGradient(0,p[1],0,p[1]+p[3]);stone.addColorStop(0,'#6c574b');stone.addColorStop(1,'#302c35');ctx.fillStyle=stone;ctx.fillRect(...p);ctx.fillStyle='#7eb35a';ctx.fillRect(p[0],p[1],p[2],7);ctx.fillStyle='rgba(27,22,28,.45)';for(let x=p[0]+18;x<p[0]+p[2]-8;x+=42)ctx.fillRect(x,p[1]+12,2,8);});
  runes.forEach(r=>{const pulse=20+Math.sin(time*4)*3;ctx.fillStyle='rgba(125,230,255,.16)';ctx.beginPath();ctx.arc(r[0],r[1],pulse+10,0,7);ctx.fill();ctx.save();ctx.translate(r[0],r[1]);ctx.rotate(Math.PI/4);ctx.fillStyle='#238eb7';ctx.fillRect(-13,-13,26,26);ctx.fillStyle='#7de6ff';ctx.fillRect(-8,-8,16,16);ctx.fillStyle='#e4ffff';ctx.fillRect(-3,-3,6,6);ctx.restore();});
  if(checkpoint){ctx.strokeStyle='#9eea86';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(checkpointX,checkpointY+34);ctx.lineTo(checkpointX,checkpointY-30);ctx.stroke();ctx.fillStyle='#9eea86';ctx.beginPath();ctx.moveTo(checkpointX,checkpointY-30);ctx.lineTo(checkpointX+22,checkpointY-20);ctx.lineTo(checkpointX,checkpointY-10);ctx.closePath();ctx.fill();}
  weapons.forEach(item=>{if(!item[3])return;const colors=['#e9edf5','#c99a58','#d9e5ef'];ctx.fillStyle='rgba(244,211,125,.18)';ctx.beginPath();ctx.arc(item[0],item[1]-18,25+Math.sin(time*4)*3,0,7);ctx.fill();ctx.strokeStyle=colors[item[2]];ctx.lineWidth=5;if(item[2]===0){ctx.beginPath();ctx.moveTo(item[0]-4,item[1]+10);ctx.lineTo(item[0]+14,item[1]-28);ctx.stroke();}else if(item[2]===1){ctx.beginPath();ctx.arc(item[0],item[1]-16,18,-Math.PI/2,Math.PI/2);ctx.stroke();}else{ctx.beginPath();ctx.moveTo(item[0]-14,item[1]+10);ctx.lineTo(item[0]+18,item[1]-32);ctx.stroke();ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(item[0]-17,item[1]-2);ctx.lineTo(item[0]+10,item[1]-38);ctx.stroke();}text(['ESPADA','ARCO','LANCA'][item[2]],item[0],item[1]+28,12,'#f4d37d','center');});
  shieldPickups.forEach(item=>{if(!item[3])return;const r=item[2]===2?20:16;ctx.fillStyle='rgba(143,210,222,.18)';ctx.beginPath();ctx.arc(item[0],item[1]-18,30+Math.sin(time*4)*3,0,7);ctx.fill();ctx.fillStyle=item[2]===2?'#f0c45d':'#4b8cb7';ctx.beginPath();ctx.moveTo(item[0],item[1]-42);ctx.lineTo(item[0]+r,item[1]-32);ctx.lineTo(item[0]+r-3,item[1]-8);ctx.lineTo(item[0],item[1]+4);ctx.lineTo(item[0]-r+3,item[1]-8);ctx.lineTo(item[0]-r,item[1]-32);ctx.closePath();ctx.fill();text('ESCUDO '+item[2],item[0],item[1]+28,12,'#8fd2de','center');});
  enemies.forEach(e=>{if(!e[4])return;const boss=e[6]===3, bob=Math.sin(time*5+e[0])*(boss?3:2),x=e[0],y=e[1]+bob;ctx.fillStyle=boss?'rgba(190,91,220,.18)':'rgba(215,67,88,.16)';ctx.beginPath();ctx.arc(x,y-8,boss?36:25,0,7);ctx.fill();ctx.fillStyle=boss?'#8f4fb4':'#a83f4d';ctx.beginPath();ctx.arc(x,y-18,boss?22:14,Math.PI,0);ctx.lineTo(x+(boss?19:12),y+8);ctx.lineTo(x-(boss?19:12),y+8);ctx.closePath();ctx.fill();ctx.fillStyle=boss?'#4d2867':'#6b293b';ctx.fillRect(x-(boss?20:13),y+2,boss?40:26,boss?38:25);ctx.fillStyle='#f9e6bd';ctx.fillRect(x-8,y-22,5,5);ctx.fillRect(x+3,y-22,5,5);ctx.fillStyle='#23182b';ctx.fillRect(x-7,y-21,3,3);ctx.fillRect(x+4,y-21,3,3);ctx.strokeStyle='#d18b55';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-10,y+28);ctx.lineTo(x-15,y+39);ctx.moveTo(x+10,y+28);ctx.lineTo(x+15,y+39);ctx.stroke();if(boss){ctx.fillStyle='#31162f';ctx.fillRect(x-32,y-52,64,7);ctx.fillStyle='#e66c83';ctx.fillRect(x-32,y-52,64*(e[5]/12),7);ctx.fillStyle='#f0c45d';ctx.beginPath();ctx.moveTo(x-18,y-38);ctx.lineTo(x-9,y-55);ctx.lineTo(x,y-40);ctx.lineTo(x+9,y-55);ctx.lineTo(x+18,y-38);ctx.fill();}});
  drawEnemyPremium();
  arrows.forEach(a=>{const colors=['#e9edf5','#e8c777','#d9e5ef'],length=a.kind===2?34:a.kind===1?24:30;ctx.strokeStyle=colors[a.kind];ctx.lineWidth=a.kind===2?6:4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x-a.vx/Math.abs(a.vx)*length,a.y-a.vy*.05);ctx.stroke();if(a.kind===2){ctx.strokeStyle='rgba(217,229,239,.35)';ctx.lineWidth=10;ctx.stroke();}});
  enemyShots.forEach(s=>{ctx.fillStyle='rgba(255,91,119,.22)';ctx.beginPath();ctx.arc(s.x,s.y,16,0,7);ctx.fill();ctx.fillStyle='#ff5b77';ctx.beginPath();ctx.arc(s.x,s.y,7,0,7);ctx.fill();ctx.strokeStyle='#ffd0d7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x-s.vx/Math.abs(s.vx)*14,s.y);ctx.lineTo(s.x,s.y);ctx.stroke();});
  if(!runes.length){ctx.fillStyle='#b67a45';ctx.fillRect(W-55,FLOOR-84,28,84);ctx.fillStyle='#7de6ff';ctx.beginPath();ctx.arc(W-41,FLOOR-52,7,0,7);ctx.fill();}
  drawHero();drawHeroPremium();drawHeroDetails();drawAtmosphere();drawUI();if(!started){ctx.fillStyle='rgba(3,5,10,.94)';ctx.fillRect(210,155,732,285);text('VIDA DE HEROI',576,230,48,'#f4d37d','center');text('Uma jornada de espada, arco e escudo.',576,275,20,'#d7e1ec','center');text('Recupere as runas, evolua sua armadura e enfrente o Guardiao.',576,310,17,'#d7e1ec','center');text('ESPACO: comecar',576,370,23,'#7de6ff','center');}if(paused){ctx.fillStyle='rgba(3,5,10,.82)';ctx.fillRect(330,220,492,170);text('PAUSADO',576,285,42,'#f4d37d','center');text('Pressione ESC para continuar',576,330,20,'#d7e1ec','center');}if(victory){ctx.fillStyle='rgba(3,5,10,.94)';ctx.fillRect(210,175,732,245);text('A LENDA VIVE',576,250,46,'#f4d37d','center');text('Voce recuperou a armadura e venceu as ruinas.',576,300,20,'#d7e1ec','center');text('ESPACO: recomecar',576,355,21,'#7de6ff','center');}}
function drawRuinsAndSky(){for(let i=0;i<32;i++){const x=(i*97+31)%W,y=40+(i*53)%230;ctx.fillStyle=i%4===0?'rgba(125,230,255,.7)':'rgba(220,232,255,.35)';ctx.fillRect(x,y,2+(i%2),2+(i%2));}const towerColor=level===1?'#111b32':'#291a35';[[120,395,70,170],[468,320,58,245],[810,390,88,175],[1010,360,64,205]].forEach((t,i)=>{ctx.fillStyle=towerColor;ctx.fillRect(t[0],t[1],t[2],t[3]);ctx.fillStyle=level===1?'#1d2a47':'#48254c';ctx.fillRect(t[0]-10,t[1]-15,t[2]+20,16);ctx.fillStyle='rgba(244,211,125,.45)';for(let y=t[1]+28;y<t[1]+t[3]-18;y+=38)ctx.fillRect(t[0]+15,y,9,14);ctx.fillStyle='rgba(5,8,18,.7)';ctx.beginPath();ctx.arc(t[0]+t[2]/2,t[1]+26,14,Math.PI,0);ctx.fill();});ctx.strokeStyle=level===1?'rgba(126,179,90,.5)':'rgba(183,122,69,.45)';ctx.lineWidth=5;for(let x=0;x<W;x+=86){ctx.beginPath();ctx.moveTo(x,FLOOR);ctx.lineTo(x+22,FLOOR-42-(x%3)*12);ctx.stroke();}}

function drawHeroPremium(){if(hero.inv>0&&Math.floor(hero.inv*12)%2===0)return;const p=hero,step=Math.sin(time*10)*2,armor=['#9b5b48','#d0d8df','#f0c45d'][p.armor];ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(p.x,p.y+38,24,6,0,0,7);ctx.fill();ctx.fillStyle='#26324f';ctx.beginPath();ctx.moveTo(p.x-16,p.y-30);ctx.lineTo(p.x-31-p.face*step,p.y-1);ctx.lineTo(p.x-8,p.y+5);ctx.lineTo(p.x+5,p.y-25);ctx.closePath();ctx.fill();ctx.fillStyle=armor;ctx.beginPath();ctx.moveTo(p.x-20,p.y-28);ctx.lineTo(p.x+20,p.y-28);ctx.lineTo(p.x+14,p.y+14);ctx.lineTo(p.x-14,p.y+14);ctx.closePath();ctx.fill();ctx.strokeStyle=p.armor===2?'#fff0a4':'rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(p.x-5,p.y-23,4,26);ctx.fillStyle='#343d5a';ctx.fillRect(p.x-17,p.y+12,12,22);ctx.fillRect(p.x+5,p.y+12,12,22);ctx.fillStyle='#151b2e';ctx.fillRect(p.x-19,p.y+32,15,5);ctx.fillRect(p.x+4,p.y+32,15,5);ctx.fillStyle=p.armor===2?'#f0c45d':'#6d7793';ctx.beginPath();ctx.arc(p.x,p.y-43,16,Math.PI,0);ctx.fill();ctx.fillStyle='#d89568';ctx.beginPath();ctx.arc(p.x,p.y-42,11,0,7);ctx.fill();ctx.fillStyle='#252038';ctx.fillRect(p.x-7,p.y-44,3,3);ctx.fillRect(p.x+4,p.y-44,3,3);if(p.armor===2){ctx.fillStyle='#f0c45d';ctx.beginPath();ctx.moveTo(p.x-13,p.y-55);ctx.lineTo(p.x-5,p.y-70);ctx.lineTo(p.x,p.y-56);ctx.lineTo(p.x+7,p.y-70);ctx.lineTo(p.x+14,p.y-55);ctx.fill();}}
function drawSpriteActors(){if(heroSprite.complete){ctx.save();ctx.globalAlpha=.22;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(hero.x,hero.y+38,34,7,0,0,7);ctx.fill();ctx.restore();ctx.save();ctx.translate(hero.x,hero.y);if(hero.face<0)ctx.scale(-1,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(heroSprite,-82,-145,164,145);ctx.restore();}enemies.forEach(e=>{if(!e[4])return;const img=e[6]===3?bossSprite:goblinSprite;if(!img.complete)return;const w=e[6]===3?190:92,h=e[6]===3?180:100;ctx.save();ctx.globalAlpha=.25;ctx.fillStyle=e[6]===3?'#b85bd7':'#000';ctx.beginPath();ctx.ellipse(e[0],e[1]+38,e[6]===3?48:25,8,0,0,7);ctx.fill();ctx.restore();ctx.save();ctx.translate(e[0],e[1]);if(e[2]<0)ctx.scale(-1,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(img,-w/2,-h,w,h);ctx.restore();});}

function drawHero(){if(hero.inv>0&&Math.floor(hero.inv*12)%2===0)return;const p=hero,colors=['#9b5b48','#d0d8df','#f0c45d'],c=colors[p.armor];if(hero.jumpFx>0){ctx.strokeStyle=`rgba(125,230,255,${hero.jumpFx*3})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y+35,26+(1-hero.jumpFx)*20,0,7);ctx.stroke();}ctx.fillStyle='#d89568';ctx.beginPath();ctx.arc(p.x,p.y-43,15,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(p.x-18,p.y-28);ctx.lineTo(p.x+18,p.y-28);ctx.lineTo(p.x+14,p.y+12);ctx.lineTo(p.x-14,p.y+12);ctx.fill();ctx.fillStyle='#343d5a';ctx.fillRect(p.x-16,p.y+10,12,25);ctx.fillRect(p.x+4,p.y+10,12,25);if(p.armor>0){ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y-43,18,Math.PI,0);ctx.stroke();}
  if(shieldLevel>0){const sx=p.x+p.face*24,sy=p.y-20;ctx.fillStyle=shieldLevel===2?'#f0c45d':'#4b8cb7';ctx.beginPath();ctx.moveTo(sx+p.face*18,sy-24);ctx.lineTo(sx-p.face*8,sy-18);ctx.lineTo(sx-p.face*8,sy+16);ctx.lineTo(sx+p.face*5,sy+27);ctx.lineTo(sx+p.face*18,sy+14);ctx.closePath();ctx.fill();ctx.strokeStyle='#dffaff';ctx.lineWidth=2;ctx.stroke();if(down('KeyL')){ctx.strokeStyle='rgba(143,210,222,.8)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(sx,sy,27,-Math.PI/2,Math.PI/2);ctx.stroke();}}if(weapon===1){ctx.strokeStyle='#c99a58';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x+p.face*17,p.y-26,18,-Math.PI/2,Math.PI/2);ctx.stroke();}else if(weapon===2){ctx.strokeStyle='#d9e5ef';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x+p.face*10,p.y-18);ctx.lineTo(p.x+p.face*(p.attack>0?70:50),p.y-30);ctx.stroke();ctx.fillStyle='#d9e5ef';ctx.beginPath();ctx.moveTo(p.x+p.face*(p.attack>0?82:62),p.y-31);ctx.lineTo(p.x+p.face*(p.attack>0?62:42),p.y-39);ctx.lineTo(p.x+p.face*(p.attack>0?66:46),p.y-24);ctx.closePath();ctx.fill();}else{ctx.strokeStyle='#e9edf5';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x+p.face*12,p.y-20);ctx.lineTo(p.x+p.face*(p.attack>0?52:36),p.y-32);ctx.stroke();}}

function drawUI(){drawChargeFx();ctx.fillStyle='rgba(3,5,10,.9)';ctx.fillRect(20,18,1112,76);text('VIDA DE HEROI',38,46,24,'#f4d37d');text(`F${level}  ${level===1?'As Ruinas do Crepusculo':level===2?'O Santuario do Rei Caido':'A Cidadela do Eclipse'}`,270,43,16);const shieldText=shieldLevel?`ESCUDO ${shieldHits}/${shieldLevel===1?3:6}`:'SEM ESCUDO';text(`HP ${hero.hp}   ARMADURA ${hero.armor+1}/3   |   ARMA: ${['ESPADA','ARCO','LANCA'][weapon]}   |   ${shieldText}`,38,74,17,'#ff8b82');text('A/D mover  SHIFT investida  W/ESPACO pular  J especial  L bloquear',650,74,13);if(msgTime&&!victory)text(msg,576,615,19,'#fff','center');const objective=runes.length?`RUNAS: ${runes.length} RESTANTES`:level===2&&enemies.some(e=>e[4])?'DERROTE O GUARDIAO':level===3&&enemies.some(e=>e[4])?'DERROTE O REI DO ECLIPSE':'PORTAO ABERTO - SIGA EM FRENTE';text(objective,576,120,18,runes.length||enemies.some(e=>e[4])?'#7de6ff':'#9eea86','center');if(level===3&&enemies.some(e=>e[4]))text(enemies.find(e=>e[6]===3&&e[4]&&e[5]<=6)?'FASE DE FURIA':'FASE DE CONFRONTO',870,145,14,'#ff82e3','center');if(checkpoint)text('CHECKPOINT ATIVO',1050,120,13,'#9eea86','right');}
