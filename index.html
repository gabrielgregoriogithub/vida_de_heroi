<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Vida de Heroi</title>
  <link rel="icon" type="image/png" href="assets/vida-de-heroi-icon.png">
  <link rel="apple-touch-icon" href="assets/vida-de-heroi-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#080d19">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#080d19; color:#d7e1ec; font-family:system-ui,sans-serif; overscroll-behavior:none; }
    main { width:min(1152px,100vw); padding:14px; }
    h1 { margin:0 0 8px; color:#f4d37d; font-size:clamp(20px,3vw,30px); }
    .wrap { position:relative; width:100%; aspect-ratio:16/9; border:2px solid #384763; box-shadow:0 0 40px #050912; background:#10182c; }
    canvas { display:block; width:100%; height:100%; image-rendering:auto; touch-action:none; }
    .help { margin-top:8px; color:#9aaac2; font-size:13px; text-align:center; }
    .touch { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; user-select:none; touch-action:none; }
    .touch .group { display:flex; gap:8px; flex-wrap:wrap; }
    .touch button { width:clamp(54px,14vw,76px); min-height:54px; border:1px solid #53627d; border-radius:12px; background:linear-gradient(#253653,#182238); color:#fff; font-weight:800; font-size:clamp(11px,2.8vw,14px); touch-action:none; box-shadow:0 4px 0 #0c1322, inset 0 1px rgba(255,255,255,.12); }
    .touch button:active { background:#35628b; transform:translateY(1px); }
    @media (max-width:799px) { .touch { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:repeat(2,54px); gap:7px; } .touch .group { display:contents; } .touch button { width:100%; min-width:0; } .touch > .group:first-child > button:nth-child(1) { grid-column:1; grid-row:1; } .touch > .group:first-child > button:nth-child(2) { grid-column:4; grid-row:1; } .touch > .group:last-child > button:nth-child(1) { grid-column:2; grid-row:2; } .touch > .group:last-child > button:nth-child(2) { grid-column:4; grid-row:2; } .touch > .group:last-child > button:nth-child(3) { grid-column:3; grid-row:2; } .touch > .group:last-child > button:nth-child(4) { grid-column:1; grid-row:2; } .touch > .group:last-child > button:nth-child(5) { grid-column:2; grid-row:1; } }
    .utility { display:flex; justify-content:center; gap:8px; margin-top:10px; }
    .utility button { border:1px solid #53627d; border-radius:8px; background:#182238; color:#d7e1ec; padding:8px 14px; font-weight:700; cursor:pointer; }
    .utility button:hover { background:#263653; border-color:#7de6ff; }
    main:fullscreen { width:100vw; height:100vh; padding:10px; background:#080d19; }
    main:fullscreen .wrap { max-height:calc(100vh - 120px); margin:auto; }
    @media (min-width:800px) { .touch { display:none; } .utility { margin-top:8px; } }
    @media (max-width:460px) { main { padding:8px; } h1 { text-align:center; } .touch { gap:6px; grid-template-rows:repeat(2,52px); } .touch button { min-height:52px; padding:4px 2px; } .help { font-size:11px; } }
    kbd { padding:2px 6px; border:1px solid #53627d; border-radius:4px; background:#182238; color:#fff; }
  </style>
</head>
<body>
<main>
  <h1>Vida de Heroi</h1>
  <div class="wrap"><canvas id="game" width="1152" height="648"></canvas></div>
  <div class="touch" aria-label="Controles de toque"><div class="group"><button data-key="ArrowLeft" aria-label="Mover para esquerda">◀</button><button data-key="ArrowRight" aria-label="Mover para direita">▶</button></div><div class="group"><button data-key="ShiftLeft">DASH</button><button data-key="KeyJ">ATK</button><button data-key="KeyL">BLOQ.</button><button data-key="Space">PULO</button><button data-key="KeyE">ABRIR</button></div></div>
  <div class="utility"><button data-key="Escape" type="button">⏸ PAUSA</button><button id="fullscreenBtn" type="button">⛶ TELA CHEIA</button><button id="soundBtn" type="button">🔊 SOM</button></div>
  <div class="help"><kbd>A</kbd><kbd>D</kbd> mover &nbsp; <kbd>W</kbd> ou <kbd>Espaco</kbd> pular &nbsp; <kbd>Shift</kbd> dash &nbsp; <kbd>J</kbd> atacar &nbsp; <kbd>L</kbd> bloquear &nbsp; <kbd>E</kbd> interagir &nbsp; <kbd>Esc</kbd> pausa</div>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=1152,H=648,FLOOR=540,WORLD_W=8500,SEA_START=4608,SEA_END=6100,CAVE_START=6500;
let audioCtx=null,soundEnabled=true;
function unlockAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();}if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(start,end,duration,wave='sine',volume=.045){if(!audioCtx||!soundEnabled)return;const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;o.frequency.setValueAtTime(start,now);o.frequency.exponentialRampToValueAtTime(Math.max(30,end),now+duration);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+duration+.02);}
function haptic(pattern=18){if(navigator.vibrate)navigator.vibrate(pattern);}
function playSfx(kind){unlockAudio();if(kind==='sword'){tone(260,920,.12,'square',.035);tone(780,1180,.08,'triangle',.022);}else if(kind==='bow'){tone(420,780,.16,'triangle',.04);tone(980,620,.08,'sine',.018);}else if(kind==='lance'){tone(125,52,.22,'sawtooth',.05);tone(260,130,.18,'square',.018);}else if(kind==='chakram'){tone(640,1120,.18,'triangle',.035);tone(1180,520,.24,'sine',.022);}else if(kind==='torch'){tone(90,180,.22,'sawtooth',.045);tone(260,520,.16,'triangle',.025);}else if(kind==='charge'){tone(180,560,.38,'triangle',.035);tone(360,980,.52,'sine',.018);}else if(kind==='special'){tone(180,760,.3,'sawtooth',.035);tone(520,1040,.24,'triangle',.025);}else if(kind==='jump'){tone(220,520,.16,'triangle',.035);}else if(kind==='doubleJump'){tone(460,980,.2,'sine',.04);tone(760,1320,.14,'triangle',.025);}else if(kind==='bounce'){tone(120,720,.28,'sawtooth',.045);tone(420,900,.16,'triangle',.025);}else if(kind==='hit'){tone(150,62,.1,'square',.04);}else if(kind==='birdHit'){tone(880,260,.12,'triangle',.035);}else if(kind==='batHit'){tone(520,90,.2,'sine',.04);}else if(kind==='bossHit'){tone(90,35,.3,'sawtooth',.06);tone(180,70,.2,'square',.03);}else if(kind==='collect'){tone(420,840,.16,'sine',.035);tone(700,1240,.22,'triangle',.025);}else if(kind==='block'){tone(180,620,.15,'square',.04);}else if(kind==='damage'){tone(105,48,.32,'sawtooth',.05);}else if(kind==='dash'){tone(190,640,.18,'triangle',.03);}}
const keys=new Set(); let pressed=new Set();
addEventListener('keydown',e=>{ if(!keys.has(e.code)) pressed.add(e.code); keys.add(e.code); unlockAudio(); if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault(); });
addEventListener('keyup',e=>keys.delete(e.code));
document.querySelectorAll('[data-key]').forEach(button=>{const code=button.dataset.key;button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture?.(e.pointerId);unlockAudio();keys.add(code);pressed.add(code);});['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(type=>button.addEventListener(type,e=>{e.preventDefault();keys.delete(code);}));});
const fullscreenBtn=document.getElementById('fullscreenBtn');fullscreenBtn?.addEventListener('click',async()=>{unlockAudio();try{if(!document.fullscreenElement)await document.querySelector('main').requestFullscreen();else await document.exitFullscreen();}catch(e){msg='Tela cheia indisponivel neste navegador.';msgTime=2;}});document.addEventListener('fullscreenchange',()=>{if(fullscreenBtn)fullscreenBtn.textContent=document.fullscreenElement?'⛶ SAIR DA TELA CHEIA':'⛶ TELA CHEIA';});
const soundBtn=document.getElementById('soundBtn');soundBtn?.addEventListener('click',()=>{soundEnabled=!soundEnabled;if(soundEnabled)unlockAudio();if(soundBtn)soundBtn.textContent=soundEnabled?'🔊 SOM':'🔇 MUDO';});
canvas.addEventListener('pointerdown',()=>{if(!started){started=true;unlockAudio();msg='A aventura comeca!';msgTime=2;}});
const down=(...codes)=>codes.some(c=>keys.has(c)), hit=(...codes)=>codes.some(c=>pressed.has(c));
let level=1, victory=false, started=false, paused=false, time=0, weapon=0, shieldLevel=0, shieldHits=0, msg='Atravesse as ruinas e recupere as runas.',msgTime=4, totalRunes=0, score=0, checkpoint=false, checkpointX=145, checkpointY=470,cameraX=0,shake=0,flash=0,bossWarning=0;
const hero={x:145,y:470,vx:0,vy:0,face:1,armor:0,hp:3,maxHp:3,inv:0,attack:0,attackCd:0,bowCd:0,charge:0,specialFx:0,dashCd:0,dashFx:0,jumps:0,jumpFx:0,jumpStyle:0};
let platforms=[],enemies=[],runes=[],arrows=[],enemyShots=[],weapons=[],shieldPickups=[],particles=[],hazards=[],heartCells=[],heartDrops=[];
function burst(x,y,color,count=10,power=90){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=power*(.35+Math.random()*.8);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.35+Math.random()*.45,max:.8,size:2+Math.random()*4,color});}}
function updateParticles(dt){particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.vx*=Math.max(0,1-3*dt);p.life-=dt;});particles=particles.filter(p=>p.life>0);}
function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.55+p.life),0,7);ctx.fill();});ctx.globalAlpha=1;}
function loadLevel(){level=1;victory=false;time=0;arrows=[];enemyShots=[];particles=[];hazards=[];heartCells=[];heartDrops=[];checkpoint=false;checkpointX=145;checkpointY=470;hero.x=checkpointX;hero.y=checkpointY;hero.vx=hero.vy=0;hero.inv=1;hero.jumps=0;hero.jumpFx=0;hero.charge=0;hero.specialFx=0;hero.dashCd=0;hero.dashFx=0;cameraX=0;shake=0;flash=0;bossWarning=0;
  platforms=[[0,FLOOR,SEA_START,108],[SEA_END,FLOOR,WORLD_W-SEA_END,108],[100,430,235,24],[420,365,225,24],[745,455,245,24],[885,290,195,24],[1240,440,190,24],[1510,350,220,24],[1810,430,190,24],[2040,315,210,24],[2360,420,190,24],[2630,330,220,24],[2910,410,240,24],[3200,270,190,24],[3500,430,180,24],[3780,360,170,24],[4050,450,220,24],[4350,320,210,24],[4470,230,110,24],[4740,445,150,20,'boat'],[5010,390,145,20,'boat'],[5300,465,170,20,'boat'],[5580,350,130,20,'stone'],[5810,430,150,20,'boat'],[6160,400,220,24],[6460,285,180,24],[6720,445,200,24],[7040,360,180,24],[7350,280,220,24],[7670,420,180,24],[7950,330,220,24],[8240,250,190,24]];
  platforms.push([1100,385,150,20,'moving',385,58,.4],[2260,390,135,20,'moving',390,70,1.7],[3100,350,130,20,'bounce',350,0,0],[3970,300,150,20,'fragile',300,0,0]);
  enemies=[[580,320,-1,38,1,2,0],[875,410,1,45,1,2,1],[970,245,-1,32,1,2,0],[1360,400,1,55,1,2,1],[1605,315,-1,45,1,2,0],[1880,390,1,60,1,2,1],[2150,280,-1,48,1,2,2],[2470,380,1,50,1,3,2],[2700,295,-1,60,1,3,1],[3010,370,1,55,1,3,0],[3250,220,-1,28,1,12,3],[3650,395,1,55,1,4,2],[4200,415,-1,58,1,4,1],[4940,360,1,48,1,3,5],[5480,285,-1,42,1,3,4],[5790,390,1,48,1,4,5],[6360,245,-1,28,1,14,3],[6830,370,1,36,1,3,6],[7200,270,-1,42,1,4,6],[7580,385,1,34,1,3,6],[8290,205,-1,18,1,30,7]];
  runes=[[535,325],[930,250],[1370,400],[1650,310],[2160,270],[2720,290],[3650,385],[4200,385],[5480,270],[6360,240],[7040,325],[7580,245]];weapons=[[335,395,1,1],[2380,385,2,1],[3535,395,3,1],[4385,285,4,1]];shieldPickups=[[210,395,1,1],[1810,395,2,1]];
  hazards=[[720,FLOOR-12,78,12,'spikes'],[1435,FLOOR-12,110,12,'spikes'],[1980,FLOOR-12,100,12,'spikes'],[2860,FLOOR-12,120,12,'spikes'],[4100,FLOOR-12,115,12,'spikes'],[4320,288,80,12,'spikes'],[6950,FLOOR-12,110,12,'spikes'],[7440,FLOOR-12,100,12,'spikes'],[7850,318,80,12,'spikes']];
  heartCells=[[3710,470,1,0]];msg='A aventura continua pelas ruinas conectadas.';msgTime=3;
}
loadLevel();
function floor(){return platforms.some(p=>hero.x>p[0]-18&&hero.x<p[0]+p[2]+18&&Math.abs(hero.y+35-p[1])<5)}
function isBoss(e){return e[6]===3||e[6]===7}
function animatePlatforms(){platforms.forEach(p=>{if(p[4]==='moving')p[1]=p[5]+Math.sin(time*1.6+p[7])*p[6];if(p[4]==='boat'){if(p[5]===undefined)p[5]=p[1];p[1]=p[5]+Math.sin(time*2.2+p[0]*.02)*5;}if(p[4]==='fragile'&&p[8]>0){p[8]-=.016;if(p[8]<=0)p[1]=FLOOR+180;}})}
function damage(){if(hero.inv>0)return; hero.inv=1.15;shake=.24;flash=.16;haptic([35,25,55]);playSfx('damage');burst(hero.x,hero.y-20,'#ff7b8e',18,140);if(hero.armor>0){hero.armor--;msg='A armadura foi quebrada!';}else{hero.hp--;msg='Voce foi atingido!';}msgTime=1.2;if(hero.hp<=0){hero.hp=hero.maxHp;hero.armor=0;hero.x=checkpointX;hero.y=checkpointY;msg=checkpoint?'Voce voltou ao checkpoint.':'A jornada recomeca...';}}
function fireWeapon(vy,power,type=weapon){const stats=[{speed:900,gravity:0,life:1.25,color:'#bde9ff',shape:'blade'},{speed:470,gravity:520,life:2.5,color:'#ffbd62',shape:'arrow'},{speed:360,gravity:95,life:3.1,color:'#d89cff',shape:'spear'},{speed:610,gravity:0,life:2.4,color:'#ff6fe5',shape:'chakram'},{speed:430,gravity:650,life:2.7,color:'#ff7b35',shape:'torch'}][type];arrows.push({x:hero.x+hero.face*28,y:hero.y-24,vx:hero.face*stats.speed,vy:vy,gravity:stats.gravity,life:stats.life,power:power,kind:type,color:stats.color,shape:stats.shape,pierce:type===2,returning:type===3,hitIds:[],trailTimer:0,spin:0});burst(hero.x+hero.face*30,hero.y-24,stats.color,8,55);}
function normalAttack(){if(hero.attackCd>0)return;const power=1+hero.armor;const cadence=[.34,.24,.85,.5,.68][weapon];hero.attackCd=cadence;hero.attack=.22;playSfx(['sword','bow','lance','chakram','torch'][weapon]);if(weapon===0)fireWeapon(0,power);else if(weapon===1)fireWeapon(-230,power);else if(weapon===2)fireWeapon(-35,power);else if(weapon===3)fireWeapon(-145,power);else fireWeapon(-180,power);}
function specialAttack(){if(hero.attackCd>0)return;hero.specialFx=.55;playSfx('special');if(weapon===0){hero.attackCd=.9;hero.attack=.45;fireWeapon(-125,3);fireWeapon(0,3);fireWeapon(125,3);msg='Especial: Espadas da Tempestade!';}else if(weapon===1){hero.attackCd=.78;hero.attack=.35;[-250,-125,0,125,250].forEach(v=>fireWeapon(v,3));msg='Especial: Chuva de Flechas!';}else if(weapon===2){hero.attackCd=1.15;hero.attack=.55;fireWeapon(-40,6);msg='Especial: Lanca do Eclipse!';}else if(weapon===3){hero.attackCd=1.05;hero.attack=.5;fireWeapon(-180,4);fireWeapon(0,4);fireWeapon(180,4);msg='Especial: Orbitas do Chakram!';}else{hero.attackCd=1.2;hero.attack=.6;fireWeapon(-250,5);fireWeapon(-120,5);fireWeapon(0,5);msg='Especial: Chuva de Brasas!';}msgTime=1.5;}
function update(dt){time+=dt;if(hit('Escape'))paused=!paused;if(victory){if(hit('Space')){hero.hp=3;hero.maxHp=3;hero.armor=0;weapon=0;shieldLevel=0;shieldHits=0;totalRunes=0;score=0;loadLevel();}return;}if(paused)return;
  if(!started){if(hit('Space','Enter')){started=true;msg='A aventura comeca!';msgTime=2;}return;}
  animatePlatforms();
  const axis=(down('ArrowRight','KeyD')?1:0)-(down('ArrowLeft','KeyA')?1:0),blocking=down('KeyL')&&shieldLevel>0;
  if(axis){hero.face=axis;hero.vx+=(axis*285-hero.vx)*Math.min(1,16*dt);}else hero.vx*=Math.max(0,1-12*dt);
  hero.dashCd=Math.max(0,hero.dashCd-dt);hero.dashFx=Math.max(0,hero.dashFx-dt);
  if(hit('ShiftLeft','ShiftRight')&&hero.dashCd<=0){hero.vx=hero.face*720;hero.inv=Math.max(hero.inv,.32);hero.dashCd=.95;hero.dashFx=.24;shake=.08;haptic(22);playSfx('dash');burst(hero.x-hero.face*18,hero.y+12,'#7de6ff',16,120);msg='Investida!';msgTime=.55;}
  if(hit('Space','ArrowUp','KeyW')){if(floor()){hero.vy=-585;hero.jumps=1;hero.jumpStyle=1;hero.jumpFx=.24;playSfx('jump');burst(hero.x,hero.y+35,'#7de6ff',10,75);}else if(hero.jumps<2){hero.vy=-535;hero.jumps=2;hero.jumpStyle=2;hero.jumpFx=.34;playSfx('doubleJump');burst(hero.x,hero.y+35,'#d88bff',16,105);msg='Pulo duplo!';msgTime=.7;}}
  if(!blocking)hero.vy+=1450*dt;else hero.vx*=.35;
  hero.attackCd=Math.max(0,hero.attackCd-dt);hero.bowCd=Math.max(0,hero.bowCd-dt);hero.attack=Math.max(0,hero.attack-dt);
  if(hero.armor===2&&down('KeyJ')){if(hero.charge===0)playSfx('charge');hero.charge=Math.min(1.2,hero.charge+dt);}else if(hero.armor===2&&hero.charge>0){if(hero.charge>=.38)specialAttack();else normalAttack();hero.charge=0;}else if(hero.armor<2&&hit('KeyJ'))normalAttack();
  hero.vy=Math.min(hero.vy,900);hero.x+=hero.vx*dt;hero.y+=hero.vy*dt;
  if(hero.y+35>=FLOOR&&!(hero.x>SEA_START&&hero.x<SEA_END)){hero.y=FLOOR-35;hero.vy=0;hero.jumps=0;} platforms.forEach(p=>{if(hero.x>p[0]-18&&hero.x<p[0]+p[2]+18&&hero.vy>=0&&hero.y+35>=p[1]&&hero.y+35<=p[1]+20){hero.y=p[1]-35;if(p[4]==='bounce'){hero.vy=-760;hero.jumpStyle=3;hero.jumpFx=.42;playSfx('bounce');burst(hero.x,hero.y+35,'#ffbd62',20,150);}else{hero.vy=0;hero.jumps=0;if(p[4]==='fragile'&&!p[8])p[8]=1.25;}}});if(hero.x>SEA_START&&hero.x<SEA_END&&hero.y>FLOOR+45){damage();hero.x=checkpointX;hero.y=checkpointY;hero.vy=0;}hero.x=Math.max(24,Math.min(WORLD_W-24,hero.x));hero.jumpFx=Math.max(0,hero.jumpFx-dt);
  hazards.forEach(h=>{if(hero.x>h[0]-16&&hero.x<h[0]+h[2]+16&&hero.y+35>h[1]-8&&hero.y+35<h[1]+22)damage();});

function drawChargeFx(){drawProgressHUD();const sx=hero.x-cameraX,sy=hero.y-20;if(hero.dashFx>0){ctx.strokeStyle=`rgba(125,230,255,${hero.dashFx*4})`;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(sx-hero.face*60,hero.y+2);ctx.lineTo(sx-hero.face*10,hero.y+2);ctx.stroke();}if(hero.armor===2&&down('KeyJ')){const pct=Math.min(1,hero.charge/1.2),pulse=Math.sin(time*8)*3;ctx.strokeStyle='rgba(244,211,125,.78)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(sx,sy,34+pulse,0,Math.PI*2*pct);ctx.stroke();ctx.fillStyle='rgba(244,211,125,.14)';ctx.beginPath();ctx.arc(sx,sy,30,0,7);ctx.fill();ctx.fillStyle='rgba(7,10,20,.9)';ctx.fillRect(sx-48,sy+44,96,9);ctx.fillStyle=pct>=.38?'#fff0a4':'#f0c45d';ctx.fillRect(sx-45,sy+47,90*pct,3);ctx.strokeStyle='rgba(255,240,164,.8)';ctx.lineWidth=1;ctx.strokeRect(sx-48,sy+44,96,9);text(pct>=.38?'ESPECIAL PRONTO':'CARREGANDO',sx,sy+70,11,pct>=.38?'#fff0a4':'#f0c45d','center');}}
function drawHearts(x,y){for(let i=0;i<hero.maxHp;i++)text(i<hero.hp?'♥':'♡',x+i*20,y,20,i<hero.hp?'#ff718e':'#624254');}
function drawUI(){drawChargeFx();ctx.fillStyle='rgba(3,5,10,.9)';ctx.fillRect(20,18,1112,76);text('VIDA DE HEROI',38,46,24,'#f4d37d');text('JORNADA CONTINUA',270,43,16,'#d7e1ec');drawHearts(38,76);const shieldText=shieldLevel?`ESCUDO ${shieldHits}/${shieldLevel===1?3:6}`:'SEM ESCUDO';text(`ARMADURA ${hero.armor+1}/3   |   ARMA: ${['ESPADA','ARCO','LANCA','CHAKRAM','TOCHA'][weapon]}   |   ${shieldText}`,145,74,17,'#ff8b82');text(`PONTOS ${score}`,505,43,15,'#f0c45d');text('A/D mover  SHIFT investida  W/ESPACO pular  J especial  L bloquear',650,74,13);if(msgTime&&!victory)text(msg,576,615,19,'#fff','center');const objective=runes.length?`RUNAS: ${runes.length} RESTANTES`:enemies.some(e=>e[4])?'DERROTE OS GUARDIOES':'PORTAO FINAL - SIGA EM FRENTE';text(objective,576,120,18,runes.length||enemies.some(e=>e[4])?'#7de6ff':'#9eea86','center');if(enemies.some(e=>e[4]&&e[6]===3))text(enemies.find(e=>e[6]===3&&e[4]&&e[5]<=6)?'FASE DE FURIA':'REI DO ECLIPSE',870,145,14,'#ff82e3','center');if(bossWarning>0)text('⚠ O REI PREPARA UM DISPARO',576,170,16,'#ff667f','center');if(checkpoint)text('CHECKPOINT ATIVO',1050,120,13,'#9eea86','right');}
let last=0;function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();pressed.clear();requestAnimationFrame(loop);}requestAnimationFrame(loop);if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
